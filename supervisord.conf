; Two processes in one container: nginx (port 80, the image cache) in front of granian
; (127.0.0.1:8080, the app).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
username=dummy
password=dummy

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
username=dummy
password=dummy

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:app]
; Sizing: the ECS container has the whole task, 2 vCPU / 4 GiB (infra thumbnail-generation-api
; container.tf, which also sets every setting for that size). Two granian workers, one per vCPU:
; a drawing holds the GIL, so a second process draws on the second vCPU. Loopback only: nginx is
; the one way in.
command=granian --interface asgi --host 127.0.0.1 --port 8080 --workers 2
    --respawn-failed-workers --factory app.api.app:create_app
directory=/app
; Not root: the app needs no privilege (it listens on 127.0.0.1:8080). Only nginx's master keeps
; root, to bind port 80; its workers run as www-data too (nginx.conf). HOME: kaleido's Chromium
; writes there; entrypoint.sh makes it, owned by www-data.
user=www-data
environment=HOME="/tmp/app"
priority=5
autorestart=true
stopsignal=INT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; /tmp/nginx_cors.conf, the CORS allow-list it includes, is written by entrypoint.sh.
command=nginx
priority=10
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
