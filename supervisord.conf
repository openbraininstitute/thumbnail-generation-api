; nginx (port 80, image cache) in front of granian (127.0.0.1:8080, the app).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
username=dummy
password=dummy

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
username=dummy
password=dummy

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:app]
; Two workers, one per vCPU (2 vCPU in ECS): a drawing holds the GIL. Loopback only.
command=granian --interface asgi --host 127.0.0.1 --port 8080 --workers 2
    --respawn-failed-workers --factory app.api.app:create_app
directory=/app
; Not root. HOME: kaleido's Chromium writes there (made by entrypoint.sh).
user=www-data
environment=HOME="/tmp/app"
priority=5
autorestart=true
stopsignal=INT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx
priority=10
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
