[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
username=dummy
password=dummy

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
username=dummy
password=dummy

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=nginx
startretries=3
priority=10

[program:app]
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
directory=/app  # Ensure Gunicorn starts from the right directory
# Sizing notes: the Fargate task has 2 vCPU / 4 GB, desired_count=1. Observed
# load (CloudWatch, 14d) is very bursty but low on average: prod CPU avg <1%
# with short spikes up to ~85%, memory avg ~25% (~1 GB). Render work
# (matplotlib / neurom / h5py) is offloaded to the anyio worker threadpool so
# the event loop stays responsive and upstream fetches overlap with CPU work.
# 2 workers use both vCPUs for parallel renders during bursts; 4 threads give
# each worker's sync pool headroom for the offloaded renders. A 3rd worker adds
# ~200 MB with no throughput gain at this volume. Adjust with task cpu/memory.
command=gunicorn api.main:app --workers 2 --threads 4 --bind 0.0.0.0:8080 -k uvicorn.workers.UvicornWorker --timeout 250
priority=5