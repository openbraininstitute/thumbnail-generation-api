services:
  thumbnail-api:
    platform: linux/amd64
    container_name: thumbnail-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:80"
    volumes:
      - ./output:/app/output
    environment:
      - entity_core_uri=https://staging.openbraininstitute.org/api/entitycore
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
    env_file:
      - path: .env.local
        required: false
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
