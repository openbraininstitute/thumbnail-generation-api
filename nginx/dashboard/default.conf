# The cache dashboard (compose service "cache-ui", local only): serves the GoAccess report and
# passes its live-update websocket to the "goaccess" service, so one port shows everything:
# http://localhost:${CACHE_UI_PORT}

server {
    listen 80;
    root /report;

    location / {
        # The page itself is a file; its websocket (Upgrade: websocket) goes to GoAccess.
        error_page 418 = @live;
        if ($http_upgrade = "websocket") {
            return 418;
        }
        index index.html;
        add_header Cache-Control "no-store";
    }

    location @live {
        resolver 127.0.0.11 valid=10s;   # Docker's DNS: resolve "goaccess" when it is asked for
        set $goaccess goaccess:7890;
        proxy_pass http://$goaccess;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
