# One JSON line per request, like the app's logs, with the same request_id.
# The path only: a query string can carry data.
# rt: total time; uct, uht, urt: upstream connect, first byte, last byte.

log_format json escape=json '{'
    '"timestamp":"$time_iso8601_ms","level":"INFO","message":"request","logger":"nginx",'
    '"request_id":"$request_id","method":"$request_method","path":"$uri","status":"$status",'
    '"bytes":"$body_bytes_sent","cache":"$upstream_cache_status","rt":"$request_time",'
    '"uct":"$upstream_connect_time","uht":"$upstream_header_time",'
    '"urt":"$upstream_response_time","remote_addr":"$remote_addr",'
    '"user_agent":"$http_user_agent","service":"thumbnail-generation-api","component":"nginx"'
    '}';

access_log /dev/stdout json;
