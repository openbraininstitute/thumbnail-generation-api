# One JSON line per request, flat like the app's lines (logs.py), with the same request_id.
# The path only, never the query string (the app's rule: a query can carry data).
#
# $upstream_connect_time  - time spent on establishing a connection with the upstream server.
# $upstream_header_time   - time to the first byte of the upstream response header.
# $upstream_response_time - time to the last byte of the upstream response body.
#                           Two values ("0.004, 0.051") when pass 2 called the app to draw.
# $request_time           - total time spent processing the request.
# $upstream_cache_status  - HIT, MISS, STALE, ... ; empty for a request refused in pass 1.

log_format json escape=json '{'
    '"timestamp":"$time_iso8601_ms","level":"INFO","message":"request","logger":"nginx",'
    '"request_id":"$request_id","method":"$request_method","path":"$uri","status":"$status",'
    '"bytes":"$body_bytes_sent","cache":"$upstream_cache_status","rt":"$request_time",'
    '"uct":"$upstream_connect_time","uht":"$upstream_header_time",'
    '"urt":"$upstream_response_time","remote_addr":"$remote_addr",'
    '"user_agent":"$http_user_agent","service":"thumbnail-generation-api","component":"nginx"'
    '}';

access_log /dev/stdout json;
