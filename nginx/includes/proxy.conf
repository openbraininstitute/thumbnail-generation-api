# Upstream settings shared by both locations. One file, included in each: nginx does not inherit
# proxy_set_header into a location that sets its own, so a server-level block would be lost.

proxy_http_version 1.1;
proxy_set_header Connection "";                 # with HTTP/1.1: keep-alive to granian (upstream app)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;      # one id in nginx's line and in the app's lines

proxy_connect_timeout 5s;
proxy_read_timeout 120s;                         # a large NWB file: download plus render
