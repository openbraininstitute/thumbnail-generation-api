# Included in each location: a location that sets its own proxy_set_header inherits none.

proxy_http_version 1.1;
proxy_set_header Connection "";                 # keep-alive to granian
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;      # same id in nginx's and the app's logs

proxy_connect_timeout 5s;
proxy_read_timeout 120s;                         # a large NWB file: download and render
