# Local only (compose.yaml): a second access log, in GoAccess format, for the cache dashboard.
# It keeps the query string: the dashboard shows which images are asked.

# No cache status (health, docs, no token): BYPASS.
map $upstream_cache_status $cache_status {
    ""      BYPASS;
    default $upstream_cache_status;
}

log_format goaccess '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time $cache_status';

access_log /var/log/nginx-local/access.log goaccess;
