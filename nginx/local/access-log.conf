# Local only (compose.yaml mounts this folder at /etc/nginx/local.d; the production image has no
# such folder, so nginx.conf includes nothing). A second access log, in the format GoAccess reads,
# on a volume the cache dashboard shares. The query string is kept here on purpose: it names the
# entity, asset and drawing parameters, which is what the dashboard is for.

# A request nginx did not look up in the cache (health, docs, no token) has no cache status;
# GoAccess counts it as BYPASS.
map $upstream_cache_status $cache_status {
    ""      BYPASS;
    default $upstream_cache_status;
}

log_format goaccess '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time $cache_status';

access_log /var/log/nginx-local/access.log goaccess;
