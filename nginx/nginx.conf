daemon off;
worker_processes 1;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include includes/access_log_format.conf;


    sendfile on;

    upstream fastapi {
        server 127.0.0.1:8080;
    }

    # improve logs by adding millisecond in ISO8601 format
    # $1 = date and time part of $time_iso8601 e.g. 2021-05-21T10:26:19
    # $2 = timezone part of $time_iso8601 e.g. +00:00
    # $3 = millisecond part of $msec e.g. 123 extracted from 1621594635.123
    map "$time_iso8601 # $msec" $time_iso8601_ms { "~(^[^+]+)(\+[0-9:]+) # \d+\.(\d+)$" $1.$3$2; }

    # map $http_authorization $bearer_token {
    #     "~^Bearer\s+(.+)$" $1;
    #     default "";
    # }
    # # Extract entity_id and asset_id from query parameters
    # map $args $entity_id {
    #     default "";
    #     "~(^|&)entity_id=([^&]*)" $2;
    # }

    # map $args $asset_id {
    #     default "";
    #     "~(^|&)asset_id=([^&]*)" $2;
    # }

    # Rendered thumbnails are effectively immutable per (entity_id, asset_id,
    # dpi), which are all carried in the request URI. Keep cached objects
    # around longer to maximize the HIT ratio (a cache HIT returns in ~0ms vs.
    # 1.5-5s for a fresh render). Larger zone + longer inactive window.
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=fastapi_cache:10m max_size=1g inactive=24h;

    # set Expires and Cache-Control: max-age headers, if Cache-Control is not set by the upstream
    map $upstream_http_cache_control $expires {
        '' 3600;
        default off;
    }
    expires $expires;

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache fastapi_cache;

            # Cache key is the request URI only (entity_id/asset_id/dpi), so a
            # rendered thumbnail is shared across all callers. The Authorization
            # header is deliberately NOT part of the key: keying per token would
            # fragment the cache per user and blow up its size for little gain.
            # This is an accepted, previously-agreed trade-off (a cache HIT is
            # served without re-checking auth upstream). Access is still gated
            # on cache MISS, where the request reaches the authenticated app.
            proxy_cache_key "$request_uri";

            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 1m;

            # Serve a stale cached image (and dedupe concurrent misses) while a
            # fresh render is in flight, so bursts don't stack up render work.
            proxy_cache_use_stale updating error timeout;
            proxy_cache_lock on;

            add_header X-Cached $upstream_cache_status;

            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Allow-Credentials;
        }
    }
}
