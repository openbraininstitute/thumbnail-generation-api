# Port 80 and the image cache, in front of granian (127.0.0.1:8080).
# Only images are stored; requests without a bearer token skip the cache.
# Not done yet: a cached image is sent without checking the caller may read the entity.

daemon off;
user www-data;                 # workers; the master stays root to bind port 80
worker_processes 2;            # "auto" counts the host's CPUs, not the container's
error_log stderr warn;
pid /tmp/nginx.pid;            # the root is read-only; /tmp is writable

events {
    worker_connections 1024;
}

http {
    include includes/access_log_format.conf;
    include /tmp/nginx_cors.conf;   # $cors_allow_origin, written by entrypoint.sh
    include /etc/nginx/local.d/*.conf;  # local only (compose.yaml)

    sendfile on;               # cache hits are sent by the kernel
    tcp_nopush on;
    server_tokens off;
    client_max_body_size 16k;  # every route is a GET

    # $time_iso8601 with milliseconds, for the logs.
    map "$time_iso8601 # $msec" $time_iso8601_ms { "~(^[^+]+)(\+[0-9:]+) # \d+\.(\d+)$" $1.$3$2; }

    # 1 without a bearer token: skip the cache, the app answers 401.
    map $http_authorization $no_bearer {
        "~*^bearer\s+\S" 0;
        default          1;
    }

    # Preflight: allow the headers the browser asks for ("*" does not cover Authorization).
    map $cors_allow_origin $cors_allow_headers {
        ""      "";
        default $http_access_control_request_headers;
    }

    map $cors_allow_origin $cors_expose_headers {
        ""      "";            # empty: no header
        default "ETag, X-Request-ID, X-Cache, Server-Timing";
    }

    # A hit must not replay the stored miss's timings: it says only HIT.
    map $upstream_cache_status $preview_server_timing {
        HIT      'cache;desc="HIT"';
        STALE    'cache;desc="STALE"';
        ""       $upstream_http_server_timing;  # cache skipped (no token)
        default  '$upstream_http_server_timing, cache;desc="$upstream_cache_status"';
    }

    upstream app {
        server 127.0.0.1:8080;  # granian
        keepalive 16;           # reuse connections (HTTP/1.1, includes/proxy.conf)
    }

    # 1 GB, 7 days unused (thumbnails are 2-80 KB; 10 MB of keys holds ~80 000 entries).
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=thumbnails:10m
                     max_size=1g inactive=7d use_temp_path=off;

    server {
        listen 80;
        server_name _;

        # Health, docs, openapi.json: not cached.
        location / {
            include includes/proxy.conf;
            proxy_pass http://app;
            add_header X-Content-Type-Options nosniff always;
        }

        # Previews, under any BASE_PATH.
        location ~ /core/[a-z-]+/preview$ {
            # Preflight answered here: the app never sees a preview's Origin.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_allow_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers $cors_allow_headers always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary Origin always;
                return 204;
            }

            include includes/proxy.conf;
            proxy_set_header Origin "";     # store no CORS header: nginx adds it per request
            proxy_hide_header Vary;         # set below
            proxy_hide_header Server-Timing;  # set below
            proxy_pass http://app;

            proxy_cache thumbnails;
            # Only the parameters that change the image, in a fixed order.
            proxy_cache_key "$uri|$arg_entity_id|$arg_asset_id|$arg_dpi|$arg_format|$arg_target|$arg_w|$arg_h";
            proxy_cache_valid 200 30d;      # images only, never errors
            proxy_cache_bypass $no_bearer;
            proxy_no_cache $no_bearer;
            # The app's Cache-Control is for browsers, not for this cache.
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            # Concurrent misses of one image draw it once; 60 s covers a large file.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 60s;
            proxy_cache_lock_age 60s;
            # Serve a stored image when the app fails.
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;

            add_header X-Cache $upstream_cache_status always;
            add_header Server-Timing $preview_server_timing always;
            add_header Timing-Allow-Origin $cors_allow_origin always;  # scripts may read timings
            add_header X-Content-Type-Options nosniff always;
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            add_header Vary Origin always;
        }
    }
}
