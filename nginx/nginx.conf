# nginx in front of granian (supervisord.conf): the only port the load balancer reaches, and the
# server-side image cache.
#
# The cache is keyed by URL parameters, as the old one, with these fixes:
#   - the key holds only the parameters that change the image, in a fixed order, so the same
#     image is one entry whatever the query order or extra parameters;
#   - only images (200) are stored: an error never hides an image from the next caller (the old
#     config stored 404s for 1 minute, so one refused caller blocked everyone);
#   - a request without a bearer token never reads the cache: it goes to the app (401);
#   - the stored image holds no CORS header: nginx adds it per request (the old cache sent the
#     first caller's origin to everyone);
#   - concurrent misses of one image draw it once (cache lock); keep-alive to the app.
# Not done here yet (owner decision 2026-11-10, planned next): checking that the caller may read the
# entity before a cached image is sent. On a miss, entitycore refuses a caller who may not.

daemon off;
user www-data;                 # workers; the master stays root to bind port 80 (ECS containerPort 80)
worker_processes 2;            # nginx only proxies and sends files; "auto" started one per host
                               # CPU (14 on a laptop) though the ECS container has 1 vCPU
error_log stderr warn;
pid /tmp/nginx.pid;            # read-only root: /tmp is writable (ECS volume)

events {
    worker_connections 1024;
}

http {
    include includes/access_log_format.conf;
    include /tmp/nginx_cors.conf;   # $cors_allow_origin, written at start from the app's settings
    include /etc/nginx/local.d/*.conf;  # local tools only (compose.yaml); none in production

    sendfile on;               # a HIT is sent from the cache file by the kernel, no copy in nginx
    tcp_nopush on;
    server_tokens off;
    client_max_body_size 16k;  # every route is a GET

    # improve logs by adding millisecond in ISO8601 format
    # $1 = date and time part of $time_iso8601 e.g. 2021-05-21T10:26:19
    # $2 = timezone part of $time_iso8601 e.g. +00:00
    # $3 = millisecond part of $msec e.g. 123 extracted from 1621594635.123
    map "$time_iso8601 # $msec" $time_iso8601_ms { "~(^[^+]+)(\+[0-9:]+) # \d+\.(\d+)$" $1.$3$2; }

    # 1 when the request has no bearer token: it skips the cache and the app answers 401.
    map $http_authorization $no_bearer {
        "~*^bearer\s+\S" 0;
        default          1;
    }

    # The headers the browser's preflight asks to send (Authorization, Content-Type, project-id…),
    # answered back when the origin is allowed. Reflected, not listed: a fixed list broke
    # core-web-app, which sends Content-Type: application/json (found with a real preflight).
    # "*" would not do: it does not cover Authorization.
    map $cors_allow_origin $cors_allow_headers {
        ""      "";
        default $http_access_control_request_headers;
    }

    map $cors_allow_origin $cors_expose_headers {
        ""      "";            # an empty value: nginx adds no header
        default "ETag, X-Request-ID, X-Cache, Server-Timing";
    }

    # Server-Timing of a preview. The cached image holds the header of the miss that drew it, so a
    # hit would replay that miss's times: a hit says only that it was one, a miss passes the app's
    # phases on (queue, meta, download, render, app) and says it was a miss.
    map $upstream_cache_status $preview_server_timing {
        HIT      'cache;desc="HIT"';
        STALE    'cache;desc="STALE"';
        ""       $upstream_http_server_timing;  # not looked up (no token): the app answered
        default  '$upstream_http_server_timing, cache;desc="$upstream_cache_status"';
    }

    upstream app {
        server 127.0.0.1:8080;  # granian; it listens on loopback only
        # Keep connections to granian open: no TCP setup per request (needs HTTP/1.1 and an empty
        # Connection header, includes/proxy.conf).
        keepalive 16;
    }

    # The image cache. Entries leave after 7 days unused, or least recently used first when 1 GB is
    # full (measured thumbnails: 2-80 KB). 10 MB of keys holds about 80 000 entries.
    # /var/cache/nginx is a writable volume in the ECS task (infra container.tf).
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=thumbnails:10m
                     max_size=1g inactive=7d use_temp_path=off;

    server {
        listen 80;
        server_name _;

        # Everything else (health, docs, openapi.json): passed through, not cached.
        location / {
            include includes/proxy.conf;
            proxy_pass http://app;
            add_header X-Content-Type-Options nosniff always;  # never guess another media type
        }

        # The previews, under any BASE_PATH: /core/{entity type}/preview.
        location ~ /core/[a-z-]+/preview$ {
            # CORS preflight answered here: the app never sees the Origin of a preview (below).
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_allow_origin always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers $cors_allow_headers always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary Origin always;
                return 204;
            }

            include includes/proxy.conf;
            proxy_set_header Origin "";     # no CORS header, no Vary: Origin in what is stored
            proxy_hide_header Vary;         # the app's own Vary; nginx sends one, below
            proxy_hide_header Server-Timing;  # nginx sends one, below ($preview_server_timing)
            proxy_pass http://app;

            proxy_cache thumbnails;
            # Only what changes the image, in a fixed order (an unknown parameter is ignored).
            proxy_cache_key "$uri|$arg_entity_id|$arg_asset_id|$arg_dpi|$arg_format|$arg_target|$arg_w|$arg_h";
            proxy_cache_valid 200 30d;      # images only: an error is never stored
            proxy_cache_bypass $no_bearer;  # no token: ask the app, which answers 401
            proxy_no_cache $no_bearer;
            # The app's "Cache-Control: private, max-age=3600" is for browsers (it is stored and
            # sent on with the image), not an instruction to this cache.
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            # Concurrent misses of one image: one draw, the other requests wait for it (renders take
            # about 50 ms plus the download, measured on a laptop; 60 s covers a large file).
            proxy_cache_lock on;
            proxy_cache_lock_timeout 60s;
            proxy_cache_lock_age 60s;
            # A stored image is still right when the app fails or is slow: serve it, not an error.
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;

            add_header X-Cache $upstream_cache_status always;
            add_header Server-Timing $preview_server_timing always;
            # Lets an allowed origin's scripts read the timings (performance.getEntries()).
            add_header Timing-Allow-Origin $cors_allow_origin always;
            add_header X-Content-Type-Options nosniff always;  # never guess another media type
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            add_header Vary Origin always;
        }
    }
}
