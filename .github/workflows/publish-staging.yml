name: publish-staging

# Manual only (Actions > publish-staging > Run workflow, on any branch): builds a :staging image to
# try a branch. The repository uses main only; a push to main publishes the dated image that
# staging and production deploy (publish-production.yml, infra *.tfvars).
on:
    workflow_dispatch:
  
permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  publish-to-aws-ecr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::985539765147:role/gh_ecr_push_thumbnail-generation-api
          aws-region: us-east-1

      - name: Authenticate with AWS Public ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.PUBLICECR_URI }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
