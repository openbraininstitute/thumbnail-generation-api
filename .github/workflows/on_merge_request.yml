name: check

# Pull requests; release.yml also runs it before publishing.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - name: lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: types
        run: uv run ty check
      - name: tests (golden images, openapi.json drift, doctests)
        run: uv run pytest --cov
      - name: dependency audit
        run: uv run pip-audit

  image:
    # Builds the image and checks it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: make smoke
      - run: make e2e
