[project]
name = "thumbnail-generation-api"
version = "0.7.0"
description = "Thumbnails of entitycore assets (morphologies, recordings, simulations) for the Open Brain Institute platform."
authors = [{ name = "Open Brain Institute" }]
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.14, not 3.15 like workspace-manager: h5py has no 3.15 wheel yet (measured 2026-11-10, uv
# falls back to a source build that needs a system HDF5). Move up when h5py ships one.
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "granian>=2.8.7",
    "h5py>=3.16.0",
    "httpx2>=2.16.0",
    "kaleido==0.2.1",       # plotly's image export; pinned with plotly, the golden images use it
    # 3.10 line on purpose: 3.11 lays out the ephys tick labels a few pixels differently, so the
    # ephys thumbnail would change (measured 2026-11-10 against the old production image; 3.10.7+
    # match it exactly and have Python 3.14 wheels). Move to 3.11 only with a new golden set.
    "matplotlib>=3.10.9,<3.11",
    "neurom>=4.0.6",
    "numpy>=2.5.4",
    "palettable>=3.3.3",
    "pillow>=13.0.0",
    "plotly==5.23.0",       # plotly 6 needs kaleido 1 (another Chrome): a new golden set first
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sentry-sdk>=2.74.0",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "audit" },
    { include-group = "serve" },
]
audit = ["pip-audit>=2.10.1"]
lint = ["ruff>=0.17.3", "ty>=0.0.97"]
test = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1", "pytest-cov>=7.1.0"]
serve = ["granian[reload]>=2.8.7"]  # make dev: reload on change

[tool.uv.build-backend]
module-name = "app"  # the import name; the distribution keeps the repository name

[tool.uv]
required-version = ">=0.12.24"
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
# Route handlers take one argument per query parameter; FastAPI binds them by name.
pylint.max-args = 8
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "D203",   # google convention: no blank line before class docstring
    "D213",   # google convention: summary on the first line
    "CPY001", # the license is in one LICENSE file, not a header per file
    "TC001",  # annotations are lazy since Python 3.14 (PEP 649); moving
    "TC002",  #   imports into TYPE_CHECKING saves nothing measurable here
    "TC003",
    "EM101",  # errors carry a stable code; the message string is part of that call
    "EM102",
    "TRY003",
    "PLR0917", # positional count: FastAPI binds route arguments by name, never by position
]

[tool.ruff.lint.isort]
known-local-folder = ["tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is how pytest checks
    "D",       # test names say what they check
    "PLR2004", # literal limits are the point of boundary tests
    "INP001",  # tests are not a package
    "S105",    # fake tokens in tests are not secrets
    "S106",
    "ARG005",  # mock transports take the request they ignore
    "ARG002",  # fakes keep the port's signatures
]
# Standalone check run inside the Docker image: output is the point, not a package.
"scripts/**" = [
    "INP001",  # not a package
    "T201",    # the report is printed
    "D103",
    "PLR2004", # HTTP statuses are what the checks compare
    "S603",    # runs the docker CLI with fixed arguments
    "S607",
    "S108",    # /tmp is a tmpfs mount point of the container, not a temp file
]
# The plot code is the code that made the golden images, kept as it was: renaming its locals or
# reshaping its loops is a risk to the pixels for no gain (tests/rendering/test_golden.py).
"src/app/rendering/*.py" = [
    "PLR2004", # the plot constants (font size 16, 3 passes) are the look
    "N806",    # matplotlib and numpy names as the original code wrote them
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses".msg = "Subclass app.domain.types.Value (frozen Pydantic) instead."

[tool.ty.environment]
python-version = "3.14"
python = "./.venv"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests", "src"]
addopts = ["--strict-markers", "--doctest-modules", "--import-mode=importlib"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "kaleido: renders with plotly's bundled Chromium (blocked by some sandboxes)",
]
filterwarnings = [
    "error", # a deprecation is fixed when it appears, not later
    # kaleido 0.2.1 (pinned with plotly 5.23) calls Thread.setDaemon, deprecated in Python 3.14.
    # ponytail: harmless until Python removes it; then plotly 6 + kaleido 1 and a new golden set.
    "ignore:setDaemon\\(\\) is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
