[project]
name = "thumbnail_generation_api"
description = "Rest API to generate thumbnails"
version = "0.0.0"
authors = [{ name = "Blue Brain Project, EPFL" }]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "gunicorn>=23.0.0",
    "uvicorn>=0.30.6",
    "PyJWT>=2.8.0",
    "neurom>=4.0.2",
    "matplotlib>=3.7.4",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "h5py>=3.11.0",
    "numpy>=2.1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.1",
    "pillow>=10.3.0",
    "httpx>=0.27.0",
    "sentry-sdk[fastapi]>=2.13.0",
    "pydantic-settings>=2.4.0",
    "plotly==5.23.0",
    "kaleido==0.2.1",  # for plotly
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pyright>=1.1.401",
    "pytest>=8.3.2",
]
